<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tokyo Strata · 東京 22 区 EXPLORE</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background: #0a0a0a;
    color: #c8c4be;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Times New Roman', serif;
    overflow: hidden;
  }
  #map { width: 100vw; height: 100vh; background: #0a0a0a; }
  .maplibregl-canvas { background: #0a0a0a; }

  #title {
    position: absolute; top: 32px; left: 40px; z-index: 5;
    font-size: 11px; letter-spacing: 6px; color: #888;
  }
  #title b {
    display: block; font-size: 28px; letter-spacing: 12px;
    font-weight: 400; margin-top: 8px; color: #e8e4dc;
  }
  #subtitle {
    position: absolute; top: 92px; left: 40px; z-index: 5;
    font-size: 11px; letter-spacing: 1px; color: #777;
    max-width: 320px; line-height: 1.7;
  }
  #legend {
    position: absolute; bottom: 40px; left: 40px; z-index: 5;
    font-size: 11px; letter-spacing: 1.5px; line-height: 2;
    color: #c8c4be;
  }
  #legend > div { display: flex; align-items: center; }
  .swatch {
    display: inline-block; width: 14px; height: 14px;
    margin-right: 14px; flex-shrink: 0;
  }
  .cname {
    display: inline-block; width: 60px;
    color: #d8d2c8; letter-spacing: 3px;
  }
  .cdesc { color: #777; letter-spacing: 1px; }
  #palace-label {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    color: #6f6862; font-size: 13px; letter-spacing: 14px;
    writing-mode: vertical-rl; text-orientation: upright;
    pointer-events: none; opacity: 0.85;
    text-shadow: 0 0 8px rgba(0,0,0,0.6);
  }
  #count {
    position: absolute; bottom: 40px; right: 40px; z-index: 5;
    font-size: 10px; color: #555; letter-spacing: 1.5px;
    text-align: right; line-height: 1.7;
  }
  #count b { color: #888; }
  .maplibregl-ctrl-attrib { display: none !important; }
</style>
</head>
<body>
<div id="title">TOKYO STRATA<b>東京 22 区 形態地層</b></div>
<div id="subtitle">耐火構造と高度の組み合わせから、東京の地層を読み解く。朽葉が古層、月白が現代層。</div>
<div id="legend">
  <div><span class="swatch" style="background:#6e4c30"></span><span class="cname">朽葉</span><span class="cdesc">古き木造の街</span></div>
  <div><span class="swatch" style="background:#b19a55"></span><span class="cname">利休茶</span><span class="cdesc">戦後の小楼</span></div>
  <div><span class="swatch" style="background:#9d9c9d"></span><span class="cname">銀鼠</span><span class="cdesc">高度成長の中層</span></div>
  <div><span class="swatch" style="background:#e8ecef"></span><span class="cname">月白</span><span class="cdesc">現代の塔</span></div>
</div>
<div id="count"></div>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
<script>
const pmtilesProtocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', pmtilesProtocol.tile);

const REGIONS = [
  { id: 'chiyoda',  name: '千代田' }, { id: 'chuo',     name: '中央' },
  { id: 'minato',   name: '港' },     { id: 'shinjuku', name: '新宿' },
  { id: 'bunkyo',   name: '文京' },   { id: 'sumida',   name: '墨田' },
  { id: 'koto',     name: '江東' },   { id: 'shinagawa',name: '品川' },
  { id: 'meguro',   name: '目黒' },   { id: 'ota',      name: '大田' },
  { id: 'setagaya', name: '世田谷' }, { id: 'shibuya',  name: '渋谷' },
  { id: 'nakano',   name: '中野' },   { id: 'suginami', name: '杉並' },
  { id: 'toshima',  name: '豊島' },   { id: 'kita',     name: '北' },
  { id: 'arakawa',  name: '荒川' },   { id: 'itabashi', name: '板橋' },
  { id: 'nerima',   name: '練馬' },   { id: 'adachi',   name: '足立' },
  { id: 'katsushika', name: '葛飾' }, { id: 'edogawa',  name: '江戸川' },
];

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {},
    layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#0a0a0a' } }]
  },
  center: [139.7400, 35.6700],
  zoom: 10.5,
  pitch: 0,
  bearing: 0,
  attributionControl: false,
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

map.on('load', async () => {
  document.getElementById('count').innerHTML =
    '<b>290 万棟</b><br>PLATEAU 東京 22 区 2023–24';

  map.addSource('bldg', { type: 'vector', url: 'pmtiles://./data/tokyo.pmtiles' });

  map.addLayer({
    id: 'bldg-fill', type: 'fill', source: 'bldg', 'source-layer': 'buildings',
    paint: {
      'fill-color': [
        'case',
        ['all',
          ['any', ['==', ['get', 'fp'], '1003'], ['==', ['get', 'fp'], '1011']],
          ['<', ['coalesce', ['get', 'h'], 0], 10]
        ], '#6e4c30',
        ['all',
          ['any', ['==', ['get', 'fp'], '1001'], ['==', ['get', 'fp'], '1002']],
          ['<', ['coalesce', ['get', 'h'], 0], 10]
        ], '#b19a55',
        ['all',
          ['>=', ['coalesce', ['get', 'h'], 0], 10],
          ['<', ['coalesce', ['get', 'h'], 0], 30]
        ], '#9d9c9d',
        ['>=', ['coalesce', ['get', 'h'], 0], 30], '#e8ecef',
        '#3a3a3a'
      ],
      'fill-opacity': 0.92,
    },
  });

  map.addLayer({
    id: 'bldg-outline', type: 'line', source: 'bldg', 'source-layer': 'buildings',
    paint: { 'line-color': '#0a0a0a', 'line-width': 0.3 }
  });

  // 皇居 label
  const palaceEl = document.createElement('div');
  palaceEl.id = 'palace-label';
  palaceEl.textContent = '皇居';
  new maplibregl.Marker({ element: palaceEl, anchor: 'center' })
    .setLngLat([139.7528, 35.6852])
    .addTo(map);
});
</script>
</body>
</html>
