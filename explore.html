<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background: #0a0a0a;
    color: #c8c4be;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Times New Roman', serif;
    overflow: hidden;
  }
  html[lang="zh-CN"] body {
    font-family: 'Songti SC', 'STSong', 'Source Han Serif SC', 'Noto Serif CJK SC', '宋体', SimSun, 'Hiragino Mincho ProN', serif;
  }
  #map { width: 100vw; height: 100vh; background: #0a0a0a; }
  .maplibregl-canvas { background: #0a0a0a; }

  #title {
    position: absolute; top: 32px; left: 40px; z-index: 5;
    font-size: 11px; letter-spacing: 6px; color: #888;
    text-shadow: 0 0 8px #0a0a0a, 0 0 4px #0a0a0a;
  }
  #title b {
    display: block; font-size: 28px; letter-spacing: 12px;
    font-weight: 400; margin-top: 8px; color: #e8e4dc;
  }
  #subtitle {
    position: absolute; top: 92px; left: 40px; z-index: 5;
    font-size: 11px; letter-spacing: 1px; color: #777;
    max-width: 320px; line-height: 1.7;
    text-shadow: 0 0 8px #0a0a0a, 0 0 4px #0a0a0a;
  }
  #legend {
    position: absolute; bottom: 40px; left: 40px; z-index: 5;
    font-size: 11px; letter-spacing: 1.5px; line-height: 2;
    color: #c8c4be;
    text-shadow: 0 0 8px #0a0a0a, 0 0 4px #0a0a0a;
  }
  #legend > div { display: flex; align-items: center; }
  .swatch {
    display: inline-block; width: 14px; height: 14px;
    margin-right: 14px; flex-shrink: 0;
  }
  .cname {
    display: inline-block; width: 60px;
    color: #d8d2c8; letter-spacing: 3px;
  }
  .cdesc { color: #777; letter-spacing: 1px; }
  #palace-label {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    color: #6f6862; font-size: 13px; letter-spacing: 14px;
    writing-mode: vertical-rl; text-orientation: upright;
    pointer-events: none; opacity: 0.85;
    text-shadow: 0 0 8px rgba(0,0,0,0.6);
  }
  #count {
    position: absolute; bottom: 40px; right: 40px; z-index: 5;
    font-size: 10px; color: #555; letter-spacing: 1.5px;
    text-align: right; line-height: 1.7;
    text-shadow: 0 0 8px #0a0a0a, 0 0 4px #0a0a0a;
  }
  #count b { color: #888; }
  .maplibregl-ctrl-attrib { display: none !important; }

  /* Language switcher — kebab menu */
  #lang-switch {
    position: absolute; top: 26px; right: 32px; z-index: 6;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  }
  #lang-toggle {
    background: transparent; border: none; padding: 4px 8px;
    color: #6b6660; cursor: pointer;
    font: inherit; font-size: 20px; line-height: 1;
  }
  #lang-toggle:hover, #lang-toggle[aria-expanded="true"] { color: #e8e4dc; }
  #lang-menu {
    position: absolute; top: 100%; right: 0;
    margin-top: 6px;
    background: #15110f;
    border: 1px solid #2a2622;
    display: flex; flex-direction: column;
    padding: 4px 0;
    min-width: 96px;
  }
  #lang-menu[hidden] { display: none; }
  #lang-menu button {
    background: transparent; border: none;
    padding: 7px 16px; cursor: pointer;
    color: #6b6660;
    font-family: inherit;
    font-size: 11px; letter-spacing: 3px;
    text-align: left; line-height: 1.5;
    width: 100%;
  }
  #lang-menu button:hover { color: #d8d2c8; background: rgba(255,255,255,0.04); }
  #lang-menu button.active { color: #e8e4dc; }

  /* Building tooltip — editorial dark popup */
  .maplibregl-popup { max-width: 280px !important; }
  .maplibregl-popup-tip { display: none !important; }
  .maplibregl-popup-content {
    background: rgba(10,10,10,0.92) !important;
    border: 1px solid #2a2622;
    padding: 14px 18px 12px !important;
    box-shadow: 0 0 24px rgba(0,0,0,0.6) !important;
    border-radius: 0 !important;
    color: #c8c4be;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    backdrop-filter: blur(6px);
  }
  html[lang="zh-CN"] .maplibregl-popup-content {
    font-family: 'Songti SC', 'STSong', 'Source Han Serif SC', 'Noto Serif CJK SC', '宋体', SimSun, 'Hiragino Mincho ProN', serif;
  }
  .maplibregl-popup-close-button {
    color: #6b6660 !important; font-size: 18px !important;
    padding: 0 6px !important; line-height: 1 !important;
    top: 4px !important; right: 4px !important;
  }
  .maplibregl-popup-close-button:hover { color: #e8e4dc !important; background: transparent !important; }
  .ts-pop-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .ts-pop-swatch { width: 12px; height: 12px; flex-shrink: 0; }
  .ts-pop-name { font-size: 13px; letter-spacing: 4px; color: #e8e4dc; }
  .ts-pop-desc { font-size: 11px; line-height: 1.7; color: #b0aca4; letter-spacing: 0.5px; }
  .ts-pop-rule { border: 0; height: 1px; background: #2a2622; margin: 10px 0 8px; }
  .ts-pop-meta { font-size: 10px; letter-spacing: 2px; color: #777; line-height: 1.6; }
  .ts-pop-meta b { color: #b0aca4; font-weight: 400; }

  /* Mobile */
  @media (max-width: 768px) {
    #title { top: 18px; left: 20px; font-size: 9px; letter-spacing: 4px; }
    #title b { font-size: 20px; letter-spacing: 6px; margin-top: 4px; }
    #subtitle {
      top: 70px; left: 20px; right: 20px;
      max-width: none;
      font-size: 10px; letter-spacing: 0.5px; line-height: 1.65;
    }
    #legend {
      bottom: 24px; left: 20px;
      font-size: 10px; letter-spacing: 1px; line-height: 1.7;
    }
    .swatch { width: 12px; height: 12px; margin-right: 10px; }
    .cname { width: 50px; letter-spacing: 2px; }
    #count {
      bottom: 24px; right: 20px;
      font-size: 9px; letter-spacing: 1px;
    }
    #lang-switch { top: 14px; right: 14px; }
    #lang-toggle { font-size: 18px; padding: 4px 6px; }
    #lang-menu { min-width: 88px; }
    #lang-menu button { padding: 8px 14px; font-size: 11px; letter-spacing: 2px; }
    .maplibregl-ctrl-top-right { top: 60px !important; }
  }
</style>
</head>
<body>
<nav id="lang-switch">
  <button id="lang-toggle" aria-label="Language" aria-expanded="false" aria-controls="lang-menu">⋮</button>
  <div id="lang-menu" hidden>
    <button data-lang-btn="ja">JP</button>
    <button data-lang-btn="zh">CN</button>
    <button data-lang-btn="en">EN</button>
  </div>
</nav>
<div id="title"><span data-i18n="explore.title.label">TOKYO STRATA</span><b data-i18n="explore.title.b">東京 22 区 形態地層</b></div>
<div id="subtitle" data-i18n="explore.subtitle">耐火構造と高度の組み合わせから、東京の地層を読み解く。朽葉が古層、月白が現代層。</div>
<div id="legend">
  <div><span class="swatch" style="background:#6e4c30"></span><span class="cname" data-i18n="common.palette.kuchiba.name">朽葉</span><span class="cdesc" data-i18n="common.palette.kuchiba.desc">古き木造の街</span></div>
  <div><span class="swatch" style="background:#b19a55"></span><span class="cname" data-i18n="common.palette.rikyu.name">利休茶</span><span class="cdesc" data-i18n="common.palette.rikyu.desc">戦後の小楼</span></div>
  <div><span class="swatch" style="background:#9d9c9d"></span><span class="cname" data-i18n="common.palette.ginnezu.name">銀鼠</span><span class="cdesc" data-i18n="common.palette.ginnezu.desc">高度成長の中層</span></div>
  <div><span class="swatch" style="background:#e8ecef"></span><span class="cname" data-i18n="common.palette.tsukishiro.name">月白</span><span class="cdesc" data-i18n="common.palette.tsukishiro.desc">現代の塔</span></div>
</div>
<div id="count" data-i18n="explore.count.html" data-i18n-html></div>
<div id="map"></div>
<script src="./i18n/strings.js"></script>
<script src="./i18n/i18n.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
<script>
const pmtilesProtocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', pmtilesProtocol.tile);

const REGIONS = [
  { id: 'chiyoda',  name: '千代田' }, { id: 'chuo',     name: '中央' },
  { id: 'minato',   name: '港' },     { id: 'shinjuku', name: '新宿' },
  { id: 'bunkyo',   name: '文京' },   { id: 'sumida',   name: '墨田' },
  { id: 'koto',     name: '江東' },   { id: 'shinagawa',name: '品川' },
  { id: 'meguro',   name: '目黒' },   { id: 'ota',      name: '大田' },
  { id: 'setagaya', name: '世田谷' }, { id: 'shibuya',  name: '渋谷' },
  { id: 'nakano',   name: '中野' },   { id: 'suginami', name: '杉並' },
  { id: 'toshima',  name: '豊島' },   { id: 'kita',     name: '北' },
  { id: 'arakawa',  name: '荒川' },   { id: 'itabashi', name: '板橋' },
  { id: 'nerima',   name: '練馬' },   { id: 'adachi',   name: '足立' },
  { id: 'katsushika', name: '葛飾' }, { id: 'edogawa',  name: '江戸川' },
];

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {},
    layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#0a0a0a' } }]
  },
  center: [139.7400, 35.6700],
  zoom: 10.5,
  pitch: 0,
  bearing: 0,
  attributionControl: false,
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

map.on('load', async () => {
  // count is now hydrated by i18n via data-i18n on #count
  map.addSource('bldg', { type: 'vector', url: 'pmtiles://./data/tokyo.pmtiles' });

  map.addLayer({
    id: 'bldg-fill', type: 'fill', source: 'bldg', 'source-layer': 'buildings',
    paint: {
      'fill-color': [
        'case',
        ['all',
          ['any', ['==', ['get', 'fp'], '1003'], ['==', ['get', 'fp'], '1011']],
          ['<', ['coalesce', ['get', 'h'], 0], 10]
        ], '#6e4c30',
        ['all',
          ['any', ['==', ['get', 'fp'], '1001'], ['==', ['get', 'fp'], '1002']],
          ['<', ['coalesce', ['get', 'h'], 0], 10]
        ], '#b19a55',
        ['all',
          ['>=', ['coalesce', ['get', 'h'], 0], 10],
          ['<', ['coalesce', ['get', 'h'], 0], 30]
        ], '#9d9c9d',
        ['>=', ['coalesce', ['get', 'h'], 0], 30], '#e8ecef',
        '#3a3a3a'
      ],
      'fill-opacity': 0.92,
    },
  });

  map.addLayer({
    id: 'bldg-outline', type: 'line', source: 'bldg', 'source-layer': 'buildings',
    paint: { 'line-color': '#0a0a0a', 'line-width': 0.3 }
  });

  // 皇居 label
  const palaceEl = document.createElement('div');
  palaceEl.id = 'palace-label';
  palaceEl.textContent = '皇居';
  new maplibregl.Marker({ element: palaceEl, anchor: 'center' })
    .setLngLat([139.7528, 35.6852])
    .addTo(map);

  // Building click → editorial popup
  const STRATUM = [
    { key: 'kuchiba',    swatch: '#6e4c30', match: (fp, h) => (fp === '1003' || fp === '1011') && h < 10 },
    { key: 'rikyu',      swatch: '#b19a55', match: (fp, h) => (fp === '1001' || fp === '1002') && h < 10 },
    { key: 'ginnezu',    swatch: '#9d9c9d', match: (fp, h) => h >= 10 && h < 30 },
    { key: 'tsukishiro', swatch: '#e8ecef', match: (fp, h) => h >= 30 },
  ];
  let activePopup = null;

  function classify(fp, h) {
    return STRATUM.find(s => s.match(fp, h)) || { key: null, swatch: '#3a3a3a' };
  }

  function popupHTML(props) {
    const fp = (props.fp ?? '').toString();
    const h = Number(props.h ?? 0);
    const stratum = classify(fp, h);
    const t = (k) => (window.I18N && window.I18N.get(k)) || '';
    const name = stratum.key ? t(`common.palette.${stratum.key}.name`) : '—';
    const desc = stratum.key ? t(`about.palette.${stratum.key}.desc`) : '';
    const fpLabel = t(`explore.tooltip.fp.${fp}`) || (fp ? fp : '—');
    const heightLabel = t('explore.tooltip.height') || 'h';
    const hStr = h > 0 ? `${h.toFixed(1)} m` : '—';
    return `
      <div class="ts-pop-head">
        <span class="ts-pop-swatch" style="background:${stratum.swatch}"></span>
        <span class="ts-pop-name">${name}</span>
      </div>
      <div class="ts-pop-desc">${desc}</div>
      <hr class="ts-pop-rule">
      <div class="ts-pop-meta">${fpLabel}　·　${heightLabel} <b>${hStr}</b></div>
    `;
  }

  map.on('click', 'bldg-fill', (e) => {
    if (!e.features || !e.features.length) return;
    if (activePopup) activePopup.remove();
    const props = e.features[0].properties || {};
    activePopup = new maplibregl.Popup({ closeButton: true, closeOnClick: true, offset: 12, maxWidth: '280px' })
      .setLngLat(e.lngLat)
      .setHTML(popupHTML(props))
      .addTo(map);
  });

  map.on('mouseenter', 'bldg-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'bldg-fill', () => { map.getCanvas().style.cursor = ''; });

  // Re-render popup on language change so labels follow lang
  if (window.I18N && window.I18N.onChange) {
    window.I18N.onChange(() => {
      if (activePopup && activePopup.isOpen()) {
        const lngLat = activePopup.getLngLat();
        const features = map.queryRenderedFeatures(map.project(lngLat), { layers: ['bldg-fill'] });
        if (features && features.length) {
          activePopup.setHTML(popupHTML(features[0].properties || {}));
        }
      }
    });
  }
});
</script>
</body>
</html>
